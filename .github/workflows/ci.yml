name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -S warning inventory.sh aws/deploy_report.sh tests/*.sh
      - name: Run tests
        run: |
          bash tests/run_tests.sh
          bash tests/test_deploy.sh
